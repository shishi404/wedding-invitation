<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原图纹饰与描摹对照</title><style>body{background:#101610;color:#d0d2b7;font:16px/1.8 serif;margin:40px}main{max-width:1140px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}img{width:100%;display:block;background:#101610;border:1px solid #84936d55}p{color:#a1ae94}a{color:#b0c693}</style><main><h1>原图纹饰与 SVG 描摹对照</h1><p>左侧为原图左上角实际纹饰；右侧为从暗色刻线提取轮廓后清理的矢量路径。斜向椭圆边框及左侧触手不纳入描摹。</p><div class="grid"><section><h2>原图局部</h2><img src="../output/reference-top-left-detail.png"></section><section><h2>实际描摹</h2><img src="../assets/entry-traced-top.svg"></section></div><p>网页将同一组纹饰按比例缩放、旋转和镜像放到外围。椭圆边框仍单独绘制，外围遮罩阻止花纹进入边框与文案区。</p><a href="https://www.jamesbousema.com/cthulhu">作品出处：James Bousema · Cthulhu Awakens</a></main></html>
