<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf3">
  <meta name="description" content="shishi x 之南 婚礼请柬 · 走进书房，寻找属于我们的婚礼邀请。">
  <title>shishi x 之南 婚礼请柬</title>
  <link rel="stylesheet" href="study.css">
  <link rel="stylesheet" href="check.css">
  <link rel="stylesheet" href="study-loft.css?v=handheld-video-7">
  <link rel="stylesheet" href="launch.css?v=dandelion-mist-blue-4">
  <link rel="stylesheet" href="record-control.css">
  <link rel="stylesheet" href="terminal-loading.css">
  <link rel="stylesheet" href="cream-theme.css?v=cream-scanlines-4">
  <link rel="stylesheet" href="invitation-save.css?v=album-1">
  <link rel="stylesheet" href="static-room.css?v=static-room-1">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body class="study-3d">
  <section id="entry-screen" class="entry-screen" aria-label="探索入口">
    <div class="entry-ornaments" aria-hidden="true">
      <span class="entry-clear-oval"></span>
      <div class="entry-marginalia"><div class="entry-flow-field"></div></div>
    </div>
    <div class="entry-content">
      <img class="entry-seal" src="assets/elder-sign.png" width="64" height="51" alt="旧印">
      <h1 class="entry-title" aria-label="欢迎来参加叶倩芸（之南）与陈萌（shishi）的婚礼">
        <span class="entry-welcome">欢迎来参加</span>
        <span class="entry-couple">
          <span class="entry-person"><span class="entry-name">叶倩芸</span><span class="entry-nickname">之南</span></span>
          <span class="entry-name-join">与</span>
          <span class="entry-person"><span class="entry-name">陈萌</span><span class="entry-nickname">shishi</span></span>
        </span>
        <span class="entry-wedding">的婚礼</span>
      </h1>
      <p class="entry-intro">我们为你留了一封请柬。<br>若不赶时间，不妨来书房找找。</p>
      <button id="start-exploration" class="primary-button" type="button">参观书房，寻找请柬</button>
      <a class="entry-invitation-button" href="invitation.html?v=album-1">还是直接阅读婚礼请柬吧</a>
    </div>
  </section>
  <main id="study" aria-label="书房探索" hidden>
    <div id="world"></div>
    <div id="scene-loading" role="status" aria-live="polite">
      <span class="scene-loading-mark" aria-hidden="true"></span>
      <span id="scene-loading-text">正在添加泥土…</span>
      <button id="scene-retry" type="button" hidden>重新载入房间</button>
    </div>
    <div class="scene-controls"><p id="scene-hint">与物品互动·便签上有字也许有线索</p><button id="scene-reset" type="button" hidden>回到初始视角</button></div>
    <nav id="hotspots" aria-label="书桌上的互动物品（键盘操作）" inert>
      <button data-object="musicbox" type="button">查看陶瓷八音盒</button>
      <button data-object="pendant" type="button">查看小吊坠</button>
      <button data-object="windchime" type="button">查看风铃</button>
      <button data-object="note" type="button">查看桌上的便利贴</button>
      <button data-object="notebook" type="button">查看旧笔记</button>
      <button data-object="record" type="button">查看唱片机</button>
      <button data-object="drawer" type="button">查看上锁的首饰盒</button>
      <button data-object="photo" type="button">查看相框照片</button>
      <button data-object="teacup" type="button">查看中古茶杯</button>
      <button data-object="handheld" type="button">查看白色 3DS XL</button>
    </nav>
    <div class="vignette" aria-hidden="true"></div>
    <header class="study-header">
      <div class="wordmark"><img src="assets/elder-sign.png" alt="" width="33" height="27"><span>寻找请柬</span></div>
      <div class="top-actions">
        <button id="music-toggle" type="button" aria-pressed="false" aria-controls="background-music">
          <svg id="music-record-icon" class="music-record-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <circle cx="32" cy="32" r="30" fill="#121512" stroke="#a69b79" stroke-width="1.2"/>
            <g fill="none" stroke="#626250" stroke-width=".7" opacity=".7"><circle cx="32" cy="32" r="25"/><circle cx="32" cy="32" r="21"/><circle cx="32" cy="32" r="17"/></g>
            <path d="M12 24 A22 22 0 0 1 25 12 M39 52 A22 22 0 0 0 52 39" fill="none" stroke="#b7b29a" stroke-width="2" opacity=".45"/>
            <circle cx="32" cy="32" r="11" fill="#ad9563"/>
            <path d="M25 28 H37 M27 36 H39" stroke="#4b4432" stroke-width="1.4"/>
            <circle cx="32" cy="32" r="2.5" fill="#121512"/>
          </svg>
          <span id="music-toggle-label">播放音乐</span>
        </button>
      </div>
    </header>
    <footer class="study-footer"><div class="inventory-wrap"><span class="inventory-title">随身物品 <span id="inventory-count">0</span></span><div id="inventory" class="inventory" aria-label="物品栏"></div></div><a id="study-direct-invitation" class="study-direct-invitation" href="invitation.html?v=album-1">直接阅读婚礼请柬</a><span class="footer-index">CASE FILE / 001</span></footer>
    <p class="sr-only" id="game-status" role="status" aria-live="polite"></p><p id="render-status" class="render-status" hidden></p>
  </main>
  <dialog id="choose-dialog" class="choose-dialog" aria-labelledby="choose-title">
    <div id="note-inspection" class="inspection-stage" aria-label="旋转调查便签模型"></div>
    <div class="note-choice-content">
    <h2 id="choose-title">便签·留言</h2><p class="dialog-intro">可以从桌子上挑选一件纪念品，寻找请柬时可能帮得上忙</p>
    <div class="keepsakes">
      <button data-keepsake="strength"><span class="item-art" aria-hidden="true"><img src="assets/item-thumbnails/musicbox.webp" alt="" decoding="async" width="512" height="512"></span><strong>陶瓷质的八音盒</strong><span>转动发条有一种脚踏实地的沉稳感</span></button>
      <button data-keepsake="intelligence"><span class="item-art" aria-hidden="true"><img src="assets/item-thumbnails/windchime.webp" alt="" decoding="async" width="512" height="512"></span><strong>一个悬挂的风铃</strong><span>风起时，杂乱的思绪被铃声理顺</span></button>
      <button data-keepsake="will"><span class="item-art" aria-hidden="true"><img src="assets/item-thumbnails/pendant.webp" alt="" decoding="async" width="512" height="512"></span><strong>小吊坠</strong><span>被珍视的不起眼的吊坠，想必是持有者心中坚定的锚点</span></button>
    </div>
    </div>
  </dialog>
  <dialog id="gain-dialog" class="gain-dialog" aria-labelledby="gain-title"><div class="dialog-eyebrow">随身物品 / 已取得</div><h2 id="gain-title"></h2><p class="gain-stat" id="gain-value"></p><button id="gain-continue" class="primary-button" type="button">继续寻找请柬的线索</button></dialog>
  <dialog id="interaction-dialog" class="interaction-dialog" aria-labelledby="interaction-title">
    <div id="object-art" class="object-art"></div>
    <div class="inspection-content"><h2 id="interaction-title"></h2><p class="narrative" id="interaction-copy"></p><div id="interaction-actions" class="dialog-actions"></div></div>
  </dialog>
  <dialog id="check-dialog" class="check-dialog" aria-labelledby="check-title check-kind" aria-describedby="check-context" data-phase="ready">
    <header class="check-heading"><h2 id="check-title">调查</h2><p id="check-kind">智力检定</p></header>
    <p id="check-context" class="sr-only"></p>
    <section class="check-frame" aria-label="检定数值与双十面骰">
      <div class="check-current"><span class="check-current-label"><span>检定</span><span>数值</span></span><strong id="check-attribute-value">55</strong></div>
      <div class="check-dice-area" id="check-dice-area">
        <div id="check-result-number" class="check-result-number" aria-hidden="true" hidden></div>
        <div class="check-fallback-dice" aria-hidden="true"><svg viewBox="0 0 80 96"><path d="M40 3 74 24 69 70 40 93 10 70 6 24Z" fill="#45505d" stroke="#b0b8bd"/><path d="m40 3-12 31 12 34 12-34ZM6 24l22 10-18 36m64-46L52 34l17 36M10 70l30-2 29 2M40 68v25" fill="none" stroke="#b0b8bd" stroke-opacity=".6"/><text x="40" y="53" text-anchor="middle" fill="#e2e8e8" font-size="17" font-family="Georgia">00</text></svg><svg viewBox="0 0 80 96"><path d="M40 3 74 24 69 70 40 93 10 70 6 24Z" fill="#171b20" stroke="#a78e5e"/><path d="m40 3-12 31 12 34 12-34ZM6 24l22 10-18 36m64-46L52 34l17 36M10 70l30-2 29 2M40 68v25" fill="none" stroke="#a78e5e" stroke-opacity=".6"/><text x="40" y="53" text-anchor="middle" fill="#e3ca92" font-size="20" font-family="Georgia">0</text></svg></div>
        <iframe id="dice-frame" title="双十面骰检定动画" tabindex="-1"></iframe>
        <button id="check-roll" type="button" aria-label="点击骰子，开始检定"><span id="check-roll-label">点击骰子</span></button>
      </div>
    </section>
    <section class="check-bonus" aria-label="本次检定的纪念品加值"><div class="check-bonus-card" id="check-bonus-card"><strong id="check-bonus-value">+0</strong><img id="check-bonus-art" alt="" hidden><span id="check-bonus-item">无对应纪念品</span><span id="check-bonus-attribute">智力</span></div></section>
    <div class="check-result-area"><p class="check-verdict sr-only" id="check-verdict" role="status" aria-live="polite">等待掷骰</p><p class="check-progress" id="check-progress">D100</p></div>
  </dialog>
  <template id="study-dice-document">
      <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
      <title>书房检定组件</title><link rel="stylesheet" href="dice.css"><link rel="stylesheet" href="cream-theme.css?v=cream-1">
    <main class="app">
      <section class="table" aria-label="双十面骰检定">
        <div class="table-art" aria-hidden="true"><div class="sigil"><span>✧</span></div></div>
        <div id="dice-stage" class="dice-stage" aria-hidden="true"></div>
      </section>
      <div class="controls" hidden><button id="roll-button" type="button"><span id="button-label">掷骰</span></button>
        <p id="hint"></p><span id="result-number">—</span><span id="result-breakdown">等待掷骰</span>
      </div>
    </main><script type="module" src="dice.js"></script>
  </template>
  <audio id="background-music" loop preload="none"></audio><audio id="record-music" preload="none"></audio><audio id="bell-sound" preload="none"></audio><audio id="musicbox-music" preload="none"></audio><audio id="dice-sound" preload="none"></audio><p class="sr-only" id="music-status" role="status" aria-live="polite"></p>
  <noscript><div class="noscript">书房探索需要启用 JavaScript。<a href="invitation.html">直接阅读婚礼请柬</a></div></noscript>
  <script src="terminal-loading.js?v=investigator-copy-2"></script>
  <script src="invitation-save.js?v=album-1"></script>
  <script src="study-bootstrap.js?v=room-artwork-20261106-2"></script>
  <script src="data.js?v=playlist-4"></script><script src="ui-sounds.js"></script><script src="music.js?v=room-artwork-20261106-2"></script><script src="study-sounds.js?v=room-artwork-20261106-2"></script><script src="study-browser.js?v=room-artwork-20261106-2"></script>
  <script src="invitation-navigation.js?v=cream-1"></script>
</body></html>
